name: memory-orchestrator cross-platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: state.py --json get（真实 CLI 中文 JSON）
        run: python scripts/state.py --json get

      - name: monitor_dialogs --days 1 --json（真实 CLI 中文 JSON）
        run: python scripts/monitor_dialogs.py --days 1 --json

      - name: Windows 中文 JSON 输出验证
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/state.py --json get
          python scripts/smoke_utf8_json.py
      - name: i18n 英文 smoke（--lang en JSON 可读）
        run: python scripts/smoke_utf8_json.py --lang en
