<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.35"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <g font-family="Menlo, monospace" fill="#60a5fa">
    <text x="60" y="120" font-size="52" font-weight="bold">◆ memory-orchestrator</text>
    <text x="60" y="170" font-size="22">Codex 长对话记忆管理 · cp-memory · ctxcompress · checkpoint · 恢复包</text>
    <text x="60" y="215" font-size="18" fill="#94a3b8">context ≤ 12 轮 → 自动提醒开新对话并生成 5 行恢复包</text>
  </g>
</svg>
